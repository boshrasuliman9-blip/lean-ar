<div id="pg-game" class="theme-3" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:10; background:#e8e6de;">
  <div id="color-fill" style="position:absolute; top:0; left:0; width:100%; height:100%; background:#e8e6de;"></div>
  
  <div id="stars-box" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); text-align:center; z-index:20;">
    <div id="stars-label" style="font-size:18px; font-weight:900; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.5); margin-bottom:8px;">المرحلة 1</div>
    <div id="stars-row" style="display:flex; gap:8px; justify-content:center;"></div>
  </div>
  
  <div id="hint" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:80px; font-weight:900; color:#fff; text-shadow:0 4px 12px rgba(0,0,0,.4); pointer-events:none; z-index:20;"></div>
  
  <div id="announce" class="rm-card theme-3" ></div>
  
  <button id="btn-stop" class="btn-next theme-3 btn-bottom">إيقاف</button>
</div>
